name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linters
        run: python -m pip install --upgrade pip ruff==0.14.2
      - name: ruff check
        run: ruff check src/ tests/
      - name: ruff format --check
        run: ruff format --check src/ tests/

  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  data-checks:
    name: Data checks (schema, ranges, nulls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
      - name: Validate committed dataset index
        run: python -m fruit_classification.checks

  smoke-train:
    name: Smoke train (end-to-end on a small sample)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
      - name: Fetch a small data sample via DVC
        run: |
          python -m pip install "dvc[s3]"
          dvc pull -f data/raw/sample.zip
      - name: Train + evaluate on the sample
        run: |
          python -m fruit_classification.smoke

  cml-metrics:
    name: CML metrics comment
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, data-checks, smoke-train]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "." cml
      - name: Fetch data sample
        run: |
          python -m pip install "dvc[s3]"
          dvc pull -f data/raw/sample.zip
      - name: Run smoke train and comment metrics
        run: |
          python -m fruit_classification.smoke
          cml-comment --log metrics.json --publish --repo ${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} > summary.md
          cml publish summary.md --repo ${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}